; ─── Upload & POST limits ─────────────────────────────────────────────────────
upload_max_filesize = 512M
post_max_size       = 520M

; ─── Execution / input timeouts ───────────────────────────────────────────────
max_execution_time  = 600
max_input_time      = 600

; ─── Memory ───────────────────────────────────────────────────────────────────
memory_limit        = 512M

; ─── Max file uploads per request ─────────────────────────────────────────────
max_file_uploads    = 50
